name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The release workflow sets up Node independently of this file. The two drift
  # silently and only bite once a tag is pushed, so check here.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Node version matches across workflows
        run: |
          node_versions=$(grep -hoE 'node-version: *[0-9]+' .github/workflows/ci.yml .github/workflows/release.yml | awk '{print $2}' | sort -u || true)
          echo "node   $(echo "$node_versions" | tr '\n' ' ')"

          if [ -z "$node_versions" ]; then
            echo "::error::found no node-version pins - has the format changed?"
            exit 1
          elif [ "$(echo "$node_versions" | wc -l)" -ne 1 ]; then
            echo "::error::ci.yml and release.yml disagree on node-version: $(echo "$node_versions" | tr '\n' ' ')"
            exit 1
          fi

  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # The root package imports the Wails desktop runtime, which links against
      # GTK4/WebKitGTK via cgo on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # The root package uses //go:embed all:frontend/dist, which must exist
      # for `go test ./...` to compile — a placeholder is enough for tests.
      - name: Create frontend/dist placeholder for go:embed
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test ./...

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
